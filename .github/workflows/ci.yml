name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: clipcrate_test
          POSTGRES_PASSWORD: synthetic_test_password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clipcrate_test -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: clipcrate
    steps:
      - uses: actions/checkout@v4
      # TODO(#13): Upgrade SQLx and the wallet SQLite dependency together before
      # moving past the compiler pinned in clipcrate/rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clipcrate
      - run: cargo check --locked --all-targets
      - run: cargo test --locked --workspace --lib
      - name: PostgreSQL campaign and leaderboard regressions
        env:
          DATABASE_URL: postgres://clipcrate_test:synthetic_test_password@localhost:5432/postgres
        run: cargo test --locked -p clipcrate-api --lib postgres_ -- --ignored

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clips-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: clips-web/.node-version
          cache: npm
          cache-dependency-path: clips-web/package-lock.json
      - run: npm ci
      - run: npm run build

  verifier:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clips-verifier
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: clips-verifier/.node-version
          cache: npm
          cache-dependency-path: clips-verifier/package-lock.json
      - run: npm ci
      - run: npx vitest run
